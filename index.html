// globals
var version = "1.05";

var sheetHeight;

var vOffset = 7;

var source = new Array();
var sheetText = new Array();
var clipboard = new Array();
var saveboard = new Array();
var img = new Image();

var begin=1, selectedArea=0;
var xOrigin=0, yOrigin=0, startX=0, startY=0, endX=0, endY=0;


// Built-in IC Definitions
ic[100]="100;F/F;3;CLK=,,RST= =1;Q=,,Q= =1";
ic[101]="555;NE555;6;Vcc=8,RESET=4=1,DISCH=7,THRES=6,CONT=5;TRIG=2,,OUT=3,,GND=1";
ic[102]="68705;MC68HC705C8;6;VDD=40,VPP=3,,,OSC1=39,OSC2=38,,RESET=1=1,IRQ=1=1,,,PD7=36,TCAP=37,TCMP=35,,,,PD5/S5=34,PD4/SCK=33,PD3/MOSI=32,PD2/MOSO=31,PD1/TD0=30,PD0/RDI=29,,,VSS=20;PA0=11,PA1=10,PA2=9,PA3=8,PA4=7,PA5=6,PA6=5,PA7=4,,PB0=12,PB1=13,PB2=14,PB3=15,PB4=16,PB5=17,PB6=18,PB7=19,,PC0=28,PC1=27,PC2=26,PC3=25,PC4=25,PC5=23,PC6=22,PC7=21";


// -------------------------
//     Canvas functions 
// -------------------------

function createCanvas(width,height){

  canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;
  canvas.style.backgroundColor = "white";
  canvas.style.marginBottom = 0;
  canvas.style.marginLeft=120;
  canvas.addEventListener('mousedown',tapEvent,false);

  document.body.appendChild(canvas);

  // Get canvas context
  ctx = canvas.getContext("2d");

  ctx.globalAlpha=1.0;
  //ctx.strokeOpacity=50;

  // clear canvas area 
  ctx.clearRect(0, 0, width,height);

}


// -------------------------
//     Tools function
// -------------------------

// Create tool buttons
function createTools() {
 
  var i=0,d=0,device=null;
  tools = document.createElement("div");

  txtrow = (sheetHeight/(gridSize-6))-32;

  var element='<center><form name="tools"><hr><small><i><b>palmDraft '+version+'</b></i><br>[javaScript]</small><hr>'; 
  element+='<input type="button" value="-----" onclick="wmode();">'
  element+='<input type="button" value="GND" onclick="gmode();"><br>'

  // item drop down menu
  element+='<select name="component">';
  element+='<option value="w">Line/Junction</option><option value="v">Power</option>';
  element+='<option value="g">Ground</option><option value="b">Bus</option><option value="t">Label</option>';
  element+='<option value="rV">Resistor</option><option value="cV">Capacitor</option>';
  element+='<option value="eV">Electrolytic</option>';
  element+='<option value="hR">Coil</option><option value="hH">Coil H</option><option value="tR">Transformer</option>';
  element+='<option value="dR">Diode</option><option value="dU">Diode U</option><option value="dD">Diode D</option>';
  element+='<option value="z">Zener</option><option value="L">Led</option>';
  element+='<option value="nR">NPN</option><option value="pR">PNP</option>';
  element+='<option value="o">OP Amp</option><option value="tp">Test point</option>';
  element+='<option value="sW">Switch</option><option value="pB">Push Button</option>';
  element+='<option value="f">Fuse</option><option value="xT">Xtal</option>';
  element+='<option value="aR">Arrow</option><option value="eA">Entry Arrow</option>';
  element+='<option value="s">---- Logic ----</option>'; // Logic section
  element+='<option value="AND">AND Gate</option><option value="NAND">NAND Gate</option>';
  element+='<option value="OR">OR Gate</option><option value="NOR">NOR Gate</option><option value="XOR">XOR Gate</option>';
  element+='<option value="INV">INV Gate</option><option value="BUF">Buffer Gate</option>';

  element+='<option value="s">---- ICs ----</option>'; // select mode

  // ic devices
  for(i in ic) {
    device = ic[i].split(";");d=(i*1)+1;
    element+='<option value="'+device[0]+'">'+device[1]+'</option>';
  }

  element+='</select><br>';

  // text labels
  element+='<input type="text" name="text" value="" size="14"><br>';
  element+='<input type="checkbox" name="Flip" value="55"><small>Flip</small><input type="button" value="Undo" onclick="undo();"><br>';
  element+='<input type="button" value="Cancel/Refresh" onclick="cancel();"><br>';
  element+='<input type="button" value="Repeat-Line" onclick="repeat();"><br>';

  element+='<input type="button" value="Select" onclick="selectBlock();">';
  element+='<input type="button" value="Cut" onclick="cutBlock();"><br>';
  element+='<input type="button" value="Copy" onclick="copyBlock();">';
  element+='<input type="button" value="Paste" onclick="pasteBlock();"><br>';
  element+='<input type="button" value="Print" onclick="printSheet(sheetWidth,sheetHeight);">';
  element+='<input type="button" value="Help" onclick="showHelp();"><br>';

  element+='<small>Diagram Source:</small><br><textarea rows="'+ txtrow; 
  element+='" cols="20" name="source" onchange="importSource();"></textarea><br>';

  element+='</form></center><br>';
 
  tools.style.position = "absolute";

// -------------------------
//     Graphics functions 
// -------------------------


function setPenColor(r,g,b) {
  s="rgb("+r+","+g+","+b+")";
  ctx.strokeStyle = s;
}


function setFillColor(r,g,b) {
  s="rgb("+r+","+g+","+b+")";
  ctx.fillStyle = s;
}


function setPenWidth(size) {
  ctx.lineWidth = size;
}


function drawDot(x, y, size) {
  ctx.fillRect(x, y, size, size);
}


function drawLine(x,y,dx,dy) {

  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(dx,dy);
  ctx.stroke();
  ctx.closePath();

}


function drawRectangle(x,y,w,h) {
  ctx.strokeRect (x, y, w, h);
}


function fillRectangle(x, y, w, h) {
  ctx.fillRect(x, y, w, h);
}


function drawText(x, y, text) {
 
  var div = document.createElement("div");
 
  div.style.position = "absolute";
  div.style.left = x+hOffset;
  div.style.top = y+vOffset;
  div.style.fontSize = fontSize;
  div.style.fontFamily = fontType;
  div.innerHTML = text;
  div.style.color = textColor;

  document.body.appendChild(div);
  sheetText.push(div);  

}


function drawCircle(x, y, r) {
 
  var endAngle = Math.PI*2;

  setPenWidth(2);
  ctx.beginPath();
  ctx.arc(x,y,r,0,endAngle,true);
  ctx.stroke();
  setPenWidth(1);

}


function drawArc(x, y, r, startAngle, endAngle) {
 
  setPenWidth(2);
  ctx.beginPath();
  ctx.arc(x,y,r,startAngle,endAngle,true);
  ctx.stroke();
  setPenWidth(1);

}


function dcursor(id,visibility,x,y) {

  var prop = new Array();
  var leftPins = new Array();

  // find device by ID
  for(i in ic) {
    prop = ic[i].split(";");
    if(prop[0]==id) break;
  }

  width = prop[2]*16;
  leftPins = prop[3].split(",");

  if(visibility) setPenColor(0,0,0);
  if(!visibility) setPenColor(255,255,255);

  setPenWidth(2); setPenColor(0,180,0);
  drawRectangle(x+1,y+8, width, (leftPins.length*gridSize)+4);

  setPenColor(0,0,0);

}


function cursor(mode,visibility,x,y) {

  x=x*gridSize; y=y*gridSize;

  if(mode>0) {
    dcursor(mode,visibility,x,y);
    return;
  }

  if(visibility)  setFillColor(0,180,0);
  if(!visibility) setFillColor(255,255,255);

  setPenWidth(2);
  ctx.fillRect(x, y-2, 2, 2);
  ctx.fillRect(x, y+2, 2, 2);
  ctx.fillRect(x-2, y, 2, 2);
  ctx.fillRect(x+2, y, 2, 2);
  setPenWidth(1);

  setFillColor(0,0,0);

}


// -------------------------
//      Draw primitives
// -------------------------


// junction

function j(x, y) {
  setFillColor(0,0,0);
  ctx.fillRect((x*gridSize)-3,(y*gridSize)-3,6,6);
}


// wire

function w(x,y,x2,y2) {

  // junction 
  if(x==x2&&y==y2) {
    j(x,y); return;
  }

  setPenWidth(2);
  drawLine(x*gridSize,y*gridSize,x2*gridSize,y2*gridSize);
  setPenWidth(1);

}


// Vcc power

function v(x,y,x2,y2) {

  // junction 
  if(x==x2&&y==y2) {
    j(x,y); return;
  }

  setPenColor(200,0,0);
  setPenWidth(2);
  drawLine(x*gridSize,y*gridSize,x2*gridSize,y2*gridSize);
  setPenWidth(1);
  setPenColor(0,0,0);

}


// bus

function b(x,y,x2,y2) {
  setPenWidth(5);
  setPenColor(0,0,150);
  drawLine(x*gridSize,y*gridSize,x2*gridSize,y2*gridSize);
  setPenWidth(1);
  setPenColor(0,0,0);
}


// image

function c(x,y,symbol) {

  symbol = "lib/"+symbol+".png";
  img.src = symbol;
 
  ctx.drawImage(img, x*gridSize, (y*gridSize)+8);
  
}


// text

function t(x,y,text) {

  if(!text) return;

  x=x*gridSize;y=y*gridSize;

  fontSize = 12;
  fontType = "Arial";

  textColor = "076060";
  drawText(x-2,y+2,text);
  textColor = "000000";

  fontSize = 10;
  fontType = "Courier";

}


// -------------------------
//      Draw components
// -------------------------


// Device (IC)

function d(x, y, flip, id){

  var xpos = 0, ypos = 0, width = 0;
   
  var prop = new Array();
  var leftPins = new Array();
  var rightPins = new Array();
  var pinout = new Array();
  var ds = new Array();

  // find device by ID
  for(i in ic) {
    prop = ic[i].split(";");
    if(prop[0]==id) break;
  }

  desc = prop[1]; 
  width = prop[2]*16;
  x=x*gridSize; y=y*gridSize;

  leftPins = prop[3].split(",");
  rightPins = prop[4].split(",");

  // IC description
  drawText(x+4,y-6,desc);

  setPenWidth(4);
  setPenColor(0,0,0);
  vpos=y+8;

  // IC body
  setFillColor(255,255,160);
  setPenColor(0,0,100);
  fillRectangle(x+1, vpos-1, width, (leftPins.length*gridSize)+4);
  drawRectangle(x+1,vpos-1, width, (leftPins.length*gridSize)+4);
  setPenColor(0,0,0);

  pinout = leftPins;
  if(flip) { pinout=rightPins;}

  // set offsets
  x+=2; ypos=vpos+3;
  yend = pinout.length;

  // Draw left side
  for(r=0;r<yend;r++){

    setPenWidth(2);
    ds=pinout[r].split("=");
    textColor = "550055";
    drawText(x+4,ypos,ds[0]);
    textColor = "CC0000";
 
    if(ds[0]){drawLine(x-18,ypos+5,x,ypos+5);}
    if(ds[1]){drawText(x-(ds[1].length*6)-4,ypos-6,ds[1]);}

    setPenWidth(1);
    if(ds[2]){drawLine(x+6,ypos,x+6+ds[0].length*6,ypos);}

    ypos=ypos+gridSize;
  }

  pinout = rightPins;
  if(flip) { pinout=leftPins;}

  ypos = vpos+3;
  yend = pinout.length;


  // Draw right side       
  for(r=0;r<yend;r++){

    setPenWidth(2);
    ds=pinout[r].split("=");
    xpos=x+width-(ds[0].length*6)-8;
    textColor = "550055";
    drawText(xpos,ypos,ds[0]);
    textColor = "CC0000";

    if(ds[0]) {drawLine(x+width,ypos+5,x+width+15,ypos+5);}
    if(ds[1]){drawText(x+width,ypos-6,ds[1]);}

    setPenWidth(1);
    textColor = "000000";

if(ds[2]){drawLine(xpos+1,ypos,xpos+1+ds[0].length*6,ypos);}
 
    ypos=ypos+gridSize;
  }
      
}


// Ground

function g(x,y) {

  setPenWidth(2);

  x=x*gridSize;y=y*gridSize;
  ctx.beginPath();ctx.moveTo(x,y);

  y+=16;ctx.lineTo(x,y);ctx.stroke();
  x-=9;ctx.moveTo(x,y);
  x+=18;ctx.lineTo(x,y);ctx.stroke();
  x-=15;y+=3;ctx.moveTo(x,y);
  x+=12;ctx.lineTo(x,y);ctx.stroke();
  x-=9;y+=3;ctx.moveTo(x,y);
  x+=6;ctx.lineTo(x,y);ctx.stroke();

  setPenWidth(2);
  ctx.closePath();

}


// Resistor (Horizontal)

function rH(x,y) {

  setPenWidth(1);

  x=x*gridSize; y=y*gridSize;
  ctx.beginPath();ctx.moveTo(x,y);

  x+=6;setPenWidth(2);ctx.lineTo(x,y);ctx.stroke();setPenWidth(1);
  x+=3;y+=4;ctx.lineTo(x,y);ctx.stroke();
  x+=3;y-=8;ctx.lineTo(x,y);ctx.stroke();
  x+=3;y+=8;ctx.lineTo(x,y);ctx.stroke();
  x+=3;y-=8;ctx.lineTo(x,y);ctx.stroke();
  x+=3;y+=8;ctx.lineTo(x,y);ctx.stroke();
  x+=3;y-=8;ctx.lineTo(x,y);ctx.stroke();
  x+=3;y+=4;ctx.lineTo(x,y);ctx.stroke();
  x+=5;setPenWidth(2);ctx.lineTo(x+1,y);ctx.stroke();

  setPenWidth(1);
  ctx.closePath();

}


// Resistor (vertical)

function rV(x,y) {

  setPenWidth(1);

  x=x*gridSize; y=y*gridSize;
  ctx.beginPath();ctx.moveTo(x,y);

  y+=5;setPenWidth(2);ctx.lineTo(x,y);ctx.stroke();setPenWidth(1);
  y+=3;x+=4;ctx.lineTo(x,y);ctx.stroke();
  y+=3;x-=8;ctx.lineTo(x,y);ctx.stroke();
  y+=3;x+=8;ctx.lineTo(x,y);ctx.stroke();
  y+=3;x-=8;ctx.lineTo(x,y);ctx.stroke();
  y+=3;x+=8;ctx.lineTo(x,y);ctx.stroke();
  y+=3;x-=8;ctx.lineTo(x,y);ctx.stroke();
  y+=3;x+=4;ctx.lineTo(x,y);ctx.stroke();
  y+=5;setPenWidth(2);ctx.lineTo(x,y+1);ctx.stroke();

  setPenWidth(1);
  ctx.closePath();

}


// Capacitor (horizontal)

function cH(x,y) {

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x+14,y);ctx.stroke();  
  ctx.moveTo(x+14,y-8);ctx.lineTo(x+14,y+8);ctx.stroke();
  ctx.moveTo(x+21,y-8);ctx.lineTo(x+21,y+8);ctx.stroke();
  ctx.moveTo(x+21,y);ctx.lineTo(x+35,y);ctx.stroke();
 
  setPenWidth(1);
  ctx.closePath();

}


// Capacitor (vertical)

function cV(x,y) {

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x,y+14);ctx.stroke();  
  ctx.moveTo(x-8,y+14);ctx.lineTo(x+8,y+14);ctx.stroke();
  ctx.moveTo(x-8,y+21);ctx.lineTo(x+8,y+21);ctx.stroke();
  ctx.moveTo(x,y+21);ctx.lineTo(x,y+35);ctx.stroke();
 
  setPenWidth(1);
  ctx.closePath();

}


// Electrolytic (vertical)

function eV(x,y) {

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x,y+14);ctx.stroke();  
  ctx.moveTo(x-4,y+14);ctx.lineTo(x+4,y+14);ctx.stroke();
  ctx.moveTo(x-4,y+16);ctx.lineTo(x+4,y+16);ctx.stroke();
  ctx.moveTo(x-8,y+21);ctx.lineTo(x+8,y+21);ctx.stroke();
  ctx.moveTo(x,y+21);ctx.lineTo(x,y+35);ctx.stroke();
  ctx.moveTo(x-8,y+21);ctx.lineTo(x-8,y+12);ctx.stroke();
  ctx.moveTo(x+8,y+21);ctx.lineTo(x+8,y+12);ctx.stroke();
  ctx.moveTo(x+4,y+5);ctx.lineTo(x+12,y+5);ctx.stroke();
  ctx.moveTo(x+8,y+1);ctx.lineTo(x+8,y+9);ctx.stroke();

  setPenWidth(1);
  ctx.closePath();

}


// Coil (right)

function hR(x,y) {

  sAng=1.9; eAng=4.4;
  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x,y+8);ctx.stroke(); 
  ctx.moveTo(x,y+40);ctx.lineTo(x,y+49);ctx.stroke();setPenWidth(1);  
  drawArc(x+1,y+14,5,sAng,eAng);
  drawArc(x+1,y+24,5,sAng,eAng);
  drawArc(x+1,y+34,5,sAng,eAng);

  setPenWidth(1);
  ctx.closePath();

}


// Coil (horizontal)

function hH(x,y) {

  sAng=0.4; eAng=2.7;
  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x+8,y);ctx.stroke(); 
  ctx.moveTo(x+40,y);ctx.lineTo(x+49,y);ctx.stroke();setPenWidth(1);  
  drawArc(x+14,y-1,5,sAng,eAng);
  drawArc(x+24,y-1,5,sAng,eAng);
  drawArc(x+34,y-1,5,sAng,eAng);

  setPenWidth(1);
  ctx.closePath();

}


// Coil (left)

function hL(x,y) {

  sAng=5.1; eAng=1.3; 
  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x,y+8);ctx.stroke(); 
  ctx.moveTo(x,y+40);ctx.lineTo(x,y+49);ctx.stroke();setPenWidth(1);  
  drawArc(x-1,y+14,5,sAng,eAng);
  drawArc(x-1,y+24,5,sAng,eAng);
  drawArc(x-1,y+34,5,sAng,eAng);

  setPenWidth(1);
  ctx.closePath();

}

// Transformer

function tR(x,y) {

  hR(x,y);
  hL(x+2,y);

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x+14,y+8);ctx.lineTo(x+14,y+40);ctx.stroke();  
  ctx.moveTo(x+19,y+8);ctx.lineTo(x+19,y+40);ctx.stroke();  

  setPenWidth(1);
  ctx.closePath();

}


// Diode (right)

function dR(x,y) {

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x+10,y);ctx.stroke();setPenWidth(1);  
  ctx.moveTo(x+10,y-8);ctx.lineTo(x+10,y+8);ctx.stroke();
  ctx.moveTo(x+10,y-7);ctx.lineTo(x+26,y);ctx.stroke();
  ctx.moveTo(x+10,y+7);ctx.lineTo(x+26,y);ctx.stroke();
  ctx.moveTo(x+26,y-9);ctx.lineTo(x+26,y+9);ctx.stroke();
  setPenWidth(2);ctx.moveTo(x+26,y);ctx.lineTo(x+33,y);ctx.stroke();

  setPenWidth(1);
  ctx.closePath();

}


// Diode (left)

function dL(x,y) {

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x+10,y);ctx.stroke();setPenWidth(1);  
  ctx.moveTo(x+10,y-9);ctx.lineTo(x+10,y+9);ctx.stroke();
  ctx.moveTo(x+10,y);ctx.lineTo(x+26,y-7);ctx.stroke();
  ctx.moveTo(x+10,y);ctx.lineTo(x+26,y+7);ctx.stroke();
  ctx.moveTo(x+26,y-8);ctx.lineTo(x+26,y+8);ctx.stroke();
  setPenWidth(2);ctx.moveTo(x+26,y);ctx.lineTo(x+33,y);ctx.stroke();

  setPenWidth(1);
  ctx.closePath();

}


// Diode (UP)

function dU(x,y) {

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x,y+10);ctx.stroke();setPenWidth(1);  
  ctx.moveTo(x-9,y+10);ctx.lineTo(x+9,y+10);ctx.stroke();
  ctx.moveTo(x,y+10);ctx.lineTo(x-7,y+26);ctx.stroke();
  ctx.moveTo(x,y+10);ctx.lineTo(x+7,y+26);ctx.stroke();
  ctx.moveTo(x-8,y+26);ctx.lineTo(x+8,y+26);ctx.stroke();
  setPenWidth(2);ctx.moveTo(x,y+26);ctx.lineTo(x,y+33);ctx.stroke();

  setPenWidth(1);
  ctx.closePath();

}


// Diode (Down)

function dD(x,y) {

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x,y+10);ctx.stroke();setPenWidth(1);  
  ctx.moveTo(x-9,y+10);ctx.lineTo(x+9,y+10);ctx.stroke();
  ctx.moveTo(x-8,y+10);ctx.lineTo(x,y+26);ctx.stroke();
  ctx.moveTo(x+8,y+10);ctx.lineTo(x,y+26);ctx.stroke();
  ctx.moveTo(x-8,y+26);ctx.lineTo(x+8,y+26);ctx.stroke();
  setPenWidth(2);ctx.moveTo(x,y+26);ctx.lineTo(x,y+33);ctx.stroke();

  setPenWidth(1);
  ctx.closePath();

}


// Diode (Zener)

function z(x,y) {

  x=x*gridSize; y=y*gridSize;
  setPenWidth(2);ctx.beginPath();

  ctx.moveTo(x,y);ctx.lineTo(x,y+10);ctx.stroke();setPenWidth(1);  
  ctx.moveTo(x-9,y+10);ctx.lineTo(x+9,y+10);ctx.stroke();

// -------------------------
//       Sheet functions 
// -------------------------


function sheet(width,height) {

  var i=0;

  if(sizeChanged) return;

  window.scrollTo(0,1);

  sheetWidth = width;
  sheetHeight = height; 

  document.body.removeChild(tools);
  createTools(); 
  
  canvas.width=width;
  canvas.height=height;

  clearSheet(1);  

  selectedArea = 0;
  sizeChanged = 1;
  begin = 1;
  
}


function clearSheet(withGrid) {

  setFillColor(255,255,255);
  fillRectangle(0,0,sheetWidth, sheetHeight);

  // Canvas grid
  setFillColor(100,100,100);

  if(withGrid) {
    for(y=0;y<sheetHeight;y+=gridSize){
      for(x=0;x<sheetWidth;x+=gridSize){
        drawDot(x,y,1);
      }
    }
  }

  // Canvas frame
  setPenWidth(2);
  drawRectangle(1, 1, sheetWidth-2, sheetHeight-2);
  setPenWidth(1);
  drawRectangle(4, 4, sheetWidth-8, sheetHeight-8);
   
  // clear text
  for (i in sheetText) document.body.removeChild(sheetText[i]);
  sheetText=[];

  if(legendFlag==1) {
    cntx = 0; spc = 8;
    for(x=gridSize*(spc/2); x<sheetWidth; x=x+(gridSize*spc)) {
      cntx=cntx+1; lgd=cntx+' ';
      drawText(x,5,lgd);
    }

    cntx = 64;
    for(y=gridSize*(spc/2); y<sheetHeight; y=y+(gridSize*spc)) {
      cntx=cntx+1; lgd=String.fromCharCode(cntx);
      drawText(6,y,lgd);
    }

    setPenWidth(2);
    drawRectangle(16, 16, sheetWidth-31, sheetHeight-31);
    setPenWidth(1);
  }

}




function printSheet(width,height) {

  x=confirm("Quit and print?");
  if(!x) return;

  window.scrollTo(0,1);
  document.body.removeChild(tools);

  clearSheet(0);     
  execSource();

  document.body.offsetHeight;
  window.print();

}


function legend(enable) {

  legendFlag=enable;
  clearSheet(1);
  begin = 1;

}


// -------------------------
//     Source functions 
// -------------------------


function addSource(mode, flip, sx, sy, ex, ey, text) {

  // lines
  if(mode=="w" || mode=="b" || mode=="v") {

    if(mode=="w" && x==ex && y==ey) source.push('j(' + x + ',' + y  +');'); 
    else source.push(mode + '(' + sx + ',' + sy + ',' + ex + ',' + ey + ');');
    exportSource(); return;
  }

  // devices (ic)
  if(mode>0) {  
    source.push('d(' + sx + ',' + sy + ',' + flip + ',' + mode + ');');
    exportSource(); return; 
  }

  // text
  if(mode=="t") {
    if(text=="") return;
    source.push('t(' + sx + ',' + sy + ',"' + text + '");');
    exportSource(); return; 
  }

  // other symbols
  source.push(mode + '(' + sx + ',' + sy + ');');
  exportSource();

}


// Export source to text area

function exportSource() {

  var i=0;
  var code="";

  for(i in source) {
    code = code+source[i]+"\n";
  }
  
  document.forms[0].elements[14].value = code;

  // write into file DB
  eraseDB(myDB);
  writeDB(myDB,code);

}


// Execute drawing code

function execSource() {

  var i=0;

  // draw schematic
  for(i in source) {
    eval(source[i]);
  }    

}


function refresh() {

  clearSheet(1);
  execSource();
  exportSource();

}


// import code from text area

function importSource() {

  var i=0;
  var code="";
  source = [];

  code = document.forms[0].elements[14].value;

  ix = 0;
  lines = code.split(";\n");

  for(i in lines) {
    if(lines[i].length>2) source[ix++] = lines[i]+';';
  }

  document.body.removeChild(tools);

  // get ic definitions
  for(i in source) {
    if(source[i].search(/ic\[/)>0) {eval(source[i]);}
  }    

  createTools();

  begin = 1;  
  refresh();


}


// -------------------------
//     Item align/save 
// -------------------------

function alignItem(mode, x, y, text) {

  refresh();

  setPenColor(0,180,0);

  // text
  if(mode=="t") t(x,y,text);

  // Logic
  if(mode=="AND")  AND(x,y);
  if(mode=="NAND") NAND(x,y);
  if(mode=="OR")   OR(x,y);
  if(mode=="NOR")  NOR(x,y);
  if(mode=="XOR")  XOR(x,y);
  if(mode=="INV")  INV(x,y);
  if(mode=="BUF")  BUF(x,y);

  // Ground
  if(mode=="g")  g(x,y);

  // Misc symbols
  if(mode=="aR")  aR(x,y);
  if(mode=="aL")  aL(x,y);
  if(mode=="tp")  {tp(x,y);t(x-1,y-3,text);}
  if(mode=="o")   o(x,y);
  if(mode=="sW")  sW(x,y);
  if(mode=="pB")  pB(x,y);
  if(mode=="eA")  eA(x,y);
  if(mode=="tR")  tR(x,y);
  if(mode=="f")   {f(x,y);t(x,y-2,text);}
  if(mode=="xT")  {xT(x,y);t(x,y-2,text);}

  // Resistor
  if(mode=="rH") {rH(x,y);t(x,y-2,text);}
  if(mode=="rV") {rV(x,y);t(x+1,y,text);}

  // Coil
  if(mode=="hH") {hH(x,y);t(x,y-2,text);}
  if(mode=="hL") {hL(x,y);t(x+1,y,text);}
  if(mode=="hR") {hR(x,y);t(x+1,y,text);}

  // Capacitor
  if(mode=="cH") {cH(x,y);t(x,y-2,text);}
  if(mode=="cV") {cV(x,y);t(x+1,y,text);}
  if(mode=="eV") {eV(x,y);t(x+1,y,text);}

  // Diode
  if(mode=="dR") {dR(x,y);t(x,y-2,text);}

  if(mode=="L")  {L(x,y);t(x+1,y,text);}

function saveItem(mode, x, y, text) {

  // text
  if(mode=="t")  {t(x,y,text);addSource(mode,0,x,y,0,0,text);return;}

  if(mode=="rH") {rH(x,y);t(x,y-2,text);addSource("t",0,x,y-2,0,0,text);}

  if(mode=="hL") {hL(x,y);t(x+1,y,text);addSource("t",0,x+1,y,0,0,text);}
  if(mode=="hR") {hR(x,y);t(x+1,y,text);addSource("t",0,x+1,y,0,0,text);}

  // Capacitor
  if(mode=="cH") {cH(x,y);t(x,y-2,text);addSource("t",0,x,y-2,0,0,text);}
  if(mode=="cV") {cV(x,y);t(x+1,y,text);addSource("t",0,x+1,y,0,0,text);}
  if(mode=="eV") {eV(x,y);t(x+1,y,text);addSource("t",0,x+1,y,0,0,text);}

  // Diode
  if(mode=="dR") {dR(x,y);t(x,y-2,text);addSource("t",0,x,y-2,0,0,text);}
  if(mode=="dL") {dL(x,y);t(x,y-2,text);addSource("t",0,x,y-2,0,0,text);}
  if(mode=="dU") {dU(x,y);t(x+1,y,text);addSource("t",0,x+1,y,0,0,text);}
  if(mode=="dD") {dD(x,y);t(x+1,y,text);addSource("t",0,x+1,y,0,0,text);}
  if(mode=="z")  {z(x,y);t(x+1,y,text); addSource("t",0,x+1,y,0,0,text);}
  if(mode=="L")  {L(x,y);t(x+1,y,text); addSource("t",0,x+1,y,0,0,text);}

  // NPN
  if(mode=="nR") {nR(x,y);t(x+3,y-1,text);addSource("t",0,x+3,y-1,0,0,text);}
  if(mode=="nL") {nL(x,y);t(x,y-2,text);addSource("t",0,x,y-2,0,0,text);}

  // PNP
  if(mode=="pR") {pR(x,y);t(x+3,y-2,text);addSource("t",0,x+3,y-2,0,0,text);}
  if(mode=="pL") {pL(x,y);t(x,y-2,text);addSource("t",0,x,y-2,0,0,text);}

  // save source code
  addSource(mode,0,x,y,0,0,"");


}


// -------------------------
//       Clipboard 
// -------------------------

function copyClipboard() {

  var i=0;
  var coord = new Array();

  // clear clipboard
  clipboard = [];
  saveboard = [];

  // save origins
  xOrigin = startX;
  yOrigin = startY;

  for(i in source) {
  
    line = source[i];

    start = line.indexOf("(");
    end = line.indexOf(");");

    mode = line.substr(0,start);
    start; end=end-1;
    line = line.substr(start+1,end-start);

    coord = line.split(",");
    
    if(startX>endX) { hold=startX;startX=endX;endX=hold; }
    if(startY>endY) { hold=startY;startY=endY;endY=hold; }

    if(coord[0]>=startX && coord[0]<=endX && coord[1]>=startY && coord[1]<=endY) {
      if(mode!="sheet" || mode!="legend") clipboard.push(source[i]);
    }
    else { saveboard.push(source[i]); }
 
  }
 
  begin=1;

}


function insertBlock(newX, newY) {

  var i=0, oldX1=0, oldY1=0, oldX2=0, oldY2=0, diffX=0, diffY=0;
  var coord = new Array();

  for(i in clipboard) {
  
    line = clipboard[i];

    start = line.indexOf("(");
    end = line.indexOf(");");

    mode = line.substr(0,start);
    start; end=end-1;
    line = line.substr(start+1,end-start);

    coord = line.split(",");
    oldX1 = coord[0]*1;
    oldY1 = coord[1]*1;
    oldX2 = coord[2]*1;
    oldY2 = coord[3]*1;

    diffX = newX-xOrigin;
    diffY = newY-yOrigin;

    if(mode=="d") {
      oldX1 = coord[0]*1;
      oldY1 = coord[1]*1;
      coord[4] = coord[2]*1;
      mode = coord[3]*1; 
   }

    addSource(mode,coord[4],oldX1+diffX,oldY1+diffY,oldX2+diffX,oldY2+diffY,coord[5]);
 
  }
  
}


// -------------------------
//      Flip mode 
// -------------------------

function flipSymbol(symbol) {

  if(symbol=="aR") symbol="aL";
  if(symbol=="nR") symbol="nL";
  if(symbol=="pR") symbol="pL";
  if(symbol=="dR") symbol="dL";
  if(symbol=="hR") symbol="hL";

  if(symbol=="rV") symbol="rH";
  if(symbol=="cV") symbol="cH";

  return symbol;

}


// -------------------------
//      Handle Events 
// -------------------------


function tapEvent(e){

  var flip = 0;
  var x = parseInt((e.pageX-124)/16);
  var y = parseInt(e.pageY/16);

  var mode = document.forms[0].elements[2].value;
  var text = document.forms[0].elements[3].value;

  if(document.forms[0].elements[4].checked) { flip=1;}
  if(flip) mode=flipSymbol(mode);


 // Select tool  -----------------------------------
  if(mode=="s") {

    if(begin) {
      begin=0;
      selectedArea=0;
      refresh();
      startX=x;
      startY=y;
      cursor(mode,1,x,y);
      return;     
    }

   if(!begin) {
     cursor(mode,0,startX,startY);
     endX=x;
     endY=y;
     setPenColor(0,180,0);

     if(startX==endX && endY==endY) {drawCircle(startX*gridSize,startY*gridSize,10); endX=startX+gridSize;endY=endY+gridSize}
     else {drawRectangle(startX*gridSize, startY*gridSize, (endX-startX)*gridSize, (endY-startY)*gridSize);}
     setPenColor(0,0,0); 
     begin=1;
     selectedArea=1;
     return;
   }

  }


  // wires  ----------------------------------------- 

  if(mode=="w" || mode=="b" || mode=="v") {

    if(begin) {
      begin=0;
      startX=x;
      startY=y;
      cursor(mode,1,x,y);
      return;     
    }

    if(!begin) {
      cursor(mode,0,startX,startY);
      endX=x;
      endY=y;
      if(mode=="w") w(startX,startY,endX,endY);
      if(mode=="v") v(startX,startY,endX,endY);
      if(mode=="b") b(startX,startY,endX,endY);

      // save source code
      addSource(mode,0,startX,startY,endX,endY,"");
      
      startX=endX;
      startY=endY;
      begin=1;
      return;
    }

  }


  // aligning ic devices  ---------------------------

  if(mode>0) {

    if(begin) {
      startX=x;
      startY=y;
      alignItem(mode,startX,startY,"");
      begin=0;
      return;
    }

    if(!begin) { 
      if(x!=startX || y!=startY) {
        alignItem(mode,x,y,"");
        startX=x;startY=y;
        begin=0; return;
      }

      d(startX,startY,flip,mode);

      // save source code
      addSource(mode,flip,startX,startY,endX,endY,"");
      begin=1;
      return;
    }

  }


  // aligning other items  ----------------------------

  // text mode
  if(mode=="t") {begin=1;saveItem(mode,x,y,text);}

  if(begin) {
    startX=x;
    startY=y;
    alignItem(mode,startX,startY,text); 
    begin=0;
    return;
  }

  // place it on 2nd tap
  if(!begin) {
    if(x!=startX || y!=startY) {
      begin=0;
      alignItem(mode,x,y,"");
      startX=x;
      startY=y;
      return;
    }
  }


  // Save item position in source ----------------------------------------

  begin=1;
  saveItem(mode,x,y,text);

}


function onEvent(event, handler) {
  
  document.body.addEventListener(event, handler, false);

}

function wmode() {
  begin=1; 
  document.forms[0].elements[2].value="w";

}


function gmode() {

  document.forms[0].elements[2].value="g";

}


function selectBlock() {
  begin=1; 
  selectedArea=0;
  document.forms[0].elements[2].value="s";
}


function copyBlock() {

  if(!selectedArea) return;

  begin=0; 
  copyClipboard();
  refresh();
  selectedArea=0;

}


function pasteBlock() {

  begin=1; 
 
  selectedArea=0;
  insertBlock(startX,startY);
  refresh();   

}


function cutBlock() {

  if(!selectedArea) return;

  begin=1; 
  copyClipboard();

  source = [];
  source=saveboard;
  saveboard=[];
  refresh();
  selectedArea=0;

}


function undo() {

  source.pop();
  refresh();
  begin=1; selectedArea=0;
}


function cancel() {

  var mode = document.forms[0].elements[2].value;

  begin=1; selectedArea=0;
  cursor(mode,0,startX,startY);
  refresh();
  
}


// Repeat wiring

function repeat() {

  var p1 = "", p2 = "";
  var coord = new Array();
  var i = source.length;
  
  if(!i) return;
  item = source[i-1];

  // eliminate w();
  if(item.charAt(0) != "w") return;
  pos=item.substring(2,item.length-2); 

  // get coordinates
  coord = pos.split(",");

  // create repeating element H/V
  if(coord[0]==coord[2]) {
    coord[0]++;coord[2]++;
    addSource("w",0,coord[0],coord[1],coord[2],coord[3],"");
  }
  if(coord[1]==coord[3]) {
    coord[1]++;coord[3]++;
    addSource("w",0,coord[0],coord[1],coord[2],coord[3],"");
  }

  refresh();

}


// ------------------------
//    Database functions
// ------------------------

function initDB(database, filename, size)
{
 
  var version = '1.0';
  var displayName = filename;
 
  try {
    if (!window.openDatabase) { return 0; } 
    else { 
      database = openDatabase(filename, version, displayName, size); 

      database.transaction(
        function (transaction) {
          transaction.executeSql('CREATE TABLE IF NOT EXISTS code(datablob BLOB NOT NULL DEFAULT "");', [], nullDataHandler, errorHandler);
        }
      ); 

    }

    return database;
  }

  catch(e) {
//    alert("DB error");
  }

  return 0;

}


// Erase file data

function eraseDB(database) {

  if(!database) return;

  database.transaction(
    function (transaction) {
      transaction.executeSql('DELETE FROM code;', [], nullDataHandler, errorHandler);
    }
  ); 

}


// Write data to file

function writeDB(database, data) {

  if(!database) return;

  database.transaction(
    function (transaction) {
      transaction.executeSql('INSERT INTO code VALUES(?);', [data ], nullDataHandler, errorHandler);
    }
  ); 

}


// Read file data

function getData(transaction,results) {

  var data = results.rows.item(0);
  code = data['datablob'];
  
  document.forms[0].elements[14].value = code;
  importSource();

}

function readDB(database) {
    
  database.transaction(
    function (transaction) {
      transaction.executeSql('SELECT * FROM code;', [], getData, errorHandler);
    }
  ); 
  
}


// Database Error Handling

function nullDataHandler(transaction, results)
{
}

function errorHandler(transaction, error)
{
  alert('Error: '+error.message+' (Code '+error.code+')');
}
